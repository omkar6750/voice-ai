[project]
name = "voice-ai"
version = "0.1.0"
description = "Small voice-agent POC with Pipecat, FastAPI, and SIM7600."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "cryptography>=50,<52",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pipecat-ai[cartesia,cli,groq,sarvam,silero]>=1.11,<2",
    "pgvector>=0.3,<1",
    "python-multipart>=0.0.20,<1",
    "pydantic-settings>=2.9,<3",
    "pypdf>=5,<7",
    "pyserial>=3.5,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "tzdata>=2025.1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.9,<1",
]

[project.scripts]
modem-status = "voice_runtime.diagnostics:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/voice_api", "packages/voice_runtime/voice_runtime"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps", "packages", "migrations", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
